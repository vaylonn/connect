# docker compose up -d   →   http://<adresse-du-nas>:8080
services:
  carnet:
    build: .
    image: carnet
    container_name: carnet
    restart: unless-stopped
    volumes:
      - carnet-data:/data   # coffres de synchronisation (chiffrés)
    ports:
      - "8080:8080"
    environment:
      # Mot de passe facultatif (identifiant : carnet). Laissez vide pour le désactiver.
      CARNET_PASSWORD: ""
      CARNET_USER: "carnet"
      # Identifiants autorisés à synchroniser, séparés par des virgules. Vide : tout le monde.
      CARNET_SYNC_USERS: ""

volumes:
  carnet-data:
