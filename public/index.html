<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet</title>
<meta name="description" content="Suivi de patrimoine personnel. Vos données restent dans votre navigateur.">
<meta name="theme-color" content="#F5F1EB">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Lora-Variable.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Navigation" data-t-aria>
    <div class="wordmark">Carnet<span class="dot">.</span></div>
    <button class="side-link" data-tab="patrimoine"><span class="ic" data-icon="patrimoine"></span><span data-t>Patrimoine</span></button>
    <button class="side-link" data-tab="analyse"><span class="ic" data-icon="analyse"></span><span data-t>Analyse</span></button>
    <button class="side-link" data-tab="historique"><span class="ic" data-icon="historique"></span><span data-t>Historique</span></button>
    <button class="side-link" data-tab="simuler"><span class="ic" data-icon="simuler"></span><span data-t>Simuler</span></button>
    <button class="side-link" data-tab="donnees"><span class="ic" data-icon="donnees"></span><span data-t>Réglages</span></button>
    <div class="side-foot"><button class="avatar" data-action="section" data-v="preferences" aria-label="Préférences" data-t-aria>C</button><span id="side-name">Votre profil</span></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="avatar" data-action="section" data-v="preferences" aria-label="Préférences" data-t-aria>C</button>
      <span class="wordmark">Carnet<span class="dot">.</span></span>
      <button class="refresh-btn top" data-action="refresh" aria-label="Actualiser les cours et l’historique" data-t-aria><span class="ic" data-icon="refresh"></span><span class="r-short">Actualiser</span><span class="r-long">Actualiser les cours</span></button>
    </header>
    <div id="view" aria-live="polite"></div>
  </main>
  <nav class="tabbar" aria-label="Onglets" data-t-aria>
    <button class="tab" data-tab="patrimoine"><span class="ic" data-icon="patrimoine"></span><span class="lbl" data-t>Patrimoine</span></button>
    <button class="tab" data-tab="analyse"><span class="ic" data-icon="analyse"></span><span class="lbl" data-t>Analyse</span></button>
    <button class="tab" data-tab="historique"><span class="ic" data-icon="historique"></span><span class="lbl" data-t>Historique</span></button>
    <button class="tab" data-tab="simuler"><span class="ic" data-icon="simuler"></span><span class="lbl" data-t>Simuler</span></button>
    <button class="tab" data-tab="donnees"><span class="ic" data-icon="donnees"></span><span class="lbl" data-t>Réglages</span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p class="p24">Carnet a besoin de JavaScript. · Carnet needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
