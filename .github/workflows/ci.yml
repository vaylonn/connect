name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe JavaScript
        run: |
          for f in server.mjs lib/*.mjs api/*.mjs tools/*.mjs tests/*.mjs public/js/*.js public/sw.js; do
            node --check "$f"
          done
      - name: Démarrage du serveur avec faux Yahoo
        run: |
          node tests/mock-yahoo.mjs &
          YAHOO_BASE=http://127.0.0.1:9911 node server.mjs &
          sleep 2
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ | grep -qi "<title>"
