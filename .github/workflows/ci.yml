name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          for f in server.mjs lib/*.mjs api/*.mjs tools/*.mjs tests/*.mjs public/js/*.js public/sw.js; do
            node --check "$f"
          done
      - name: Calculations and sync API
        run: node --test tests/*.test.mjs
      - name: Server startup with fake Yahoo
        run: |
          node tests/mock-yahoo.mjs &
          YAHOO_BASE=http://127.0.0.1:9911 node server.mjs &
          sleep 2
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ | grep -qi "<title>"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright and Chromium (test only, the app has no dependencies)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: End-to-end tests in Chromium
        run: node --test tests/browser.e2e.mjs
